<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="Detalhes da obra no MangaMorph.">
  <title>MangaMorph — Detalhes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/style.css?v=017">
  <link rel="stylesheet" href="assets/css/manga.css?v=004">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="MangaMorph — voltar ao início">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span class="brand-name">Manga<span>Morph</span></span>
    </a>
    <div class="topbar-actions">
      <button class="icon-button" id="themeToggle" aria-label="Alternar tema" title="Alternar tema">◐</button>
    </div>
  </header>

  <main class="manga-page" id="mangaPage">
    <a class="back-link" href="./">← Voltar</a>

    <section class="manga-detail manga-detail-compact">
      <div class="detail-cover compact-cover" id="detailCover">
        <span class="detail-cover-kicker">MANGAMORPH</span>
        <strong id="coverTitle">NEON<br>RONIN</strong>
        <small>OBRA</small>
      </div>

      <div class="detail-content compact-content">
        <p class="eyebrow">DETALHES DA OBRA</p>
        <h1 id="mangaTitle">Neon Ronin</h1>
        <p class="detail-alt-title" id="mangaAltTitle"></p>

        <div class="status-picker">
          <button class="button button-primary button-full" id="statusButton" type="button" aria-expanded="false">
            <span aria-hidden="true">＋</span>
            <span id="statusLabel">Escolher status</span>
            <span class="status-chevron" aria-hidden="true">⌄</span>
          </button>
          <div class="status-menu" id="statusMenu" hidden>
            <button type="button" data-status="Quero ler">Quero ler</button>
            <button type="button" data-status="Lendo">Lendo</button>
            <button type="button" data-status="Concluído">Concluído</button>
            <button type="button" data-status="Pausado">Pausado</button>
          </div>
        </div>

        <div class="icon-actions">
          <button class="mini-action" id="favoriteDetail" type="button" aria-label="Favoritar" title="Favoritar">☆</button>
          <button class="mini-action" id="markDetail" type="button" aria-label="Marcar obra" title="Marcar obra">⚑</button>
          <button class="mini-action" id="shareDetail" type="button" aria-label="Compartilhar" title="Compartilhar">↗</button>
        </div>

        <div class="detail-tags" id="mangaTags"></div>

        <div class="publication-line">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="mangaPublication">PUBLICAÇÃO: 2026, EM LANÇAMENTO</span>
        </div>

        <div class="detail-meta detail-meta-compact">
          <span id="mangaRating">★ 9,2</span>
          <span id="mangaFavorites">☆ 48,2 mil</span>
          <span id="mangaReads">◉ 986 mil</span>
          <span id="mangaComments">💬 0</span>
        </div>

        <div class="description-box">
          <p class="detail-description collapsed" id="mangaDescription"></p>
          <button class="description-toggle" id="toggleDescription" type="button" aria-expanded="false">
            Ver mais ↓
          </button>
        </div>
      </div>
    </section>

    <dl class="detail-facts detail-facts-grid">
      <div><dt>Status</dt><dd>Em lançamento</dd></div>
      <div><dt>Ano</dt><dd>2026</dd></div>
      <div><dt>Último capítulo</dt><dd id="latestChapter">127</dd></div>
      <div><dt>Idioma</dt><dd>Português</dd></div>
    </dl>

    <section class="chapters-section" id="chapters">
      <div class="chapters-heading">
        <div>
          <p class="eyebrow">CAPÍTULOS</p>
          <h2>Capítulos recentes</h2>
        </div>
        <span id="chapterCount"></span>
      </div>

      <div class="chapter-sort">
        <button class="sort-button active" id="sortToggle" type="button" aria-label="Alternar ordem dos capítulos" aria-pressed="true">Decrescente ↓</button>
      </div>

      <div class="chapter-list" id="chapterList"></div>
    </section>
  </main>

  <footer class="footer">
    <div><strong>MangaMorph</strong><span>v0.1</span></div>
    <p>Página de obra demonstrativa.</p>
  </footer>

  <script src="assets/js/manga.js?v=004" defer></script>
</body>
</html>
